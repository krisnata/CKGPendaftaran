<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>CKG Auto Importer & Pendaftaran</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 280px;
      padding: 14px;
      margin: 0;
      background: #f8fafc;
      color: #1e293b;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }
    .title {
      font-size: 13px;
      font-weight: 700;
      color: #0369a1;
    }
    .desc {
      font-size: 11.5px;
      color: #64748b;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #16a34a 0%, #0d9488 100%);
      color: white;
      text-align: center;
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 700;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      box-sizing: border-box;
      box-shadow: 0 4px 10px rgba(16, 185, 129, 0.25);
    }
    .btn:hover {
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Logo" class="logo">
    <div class="title">CKG Auto Importer</div>
  </div>
  <p class="desc">
    Gunakan Side Panel di sebelah kanan peramban untuk mengolah data mentah dan menjalankan pendaftaran otomatis ke web CKG.
  </p>
  <button class="btn" id="btn-open-sidepanel">▶ Buka Side Panel CKG</button>

  <script src="popup.js"></script>
</body>
</html>
